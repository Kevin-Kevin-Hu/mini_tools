# ruff 配置（Python 版 ESLint，负责 lint + format）。
# CI 与本地均通过 `python -m ruff` 调用；本文件位于仓库根，backend/ 下的文件会自动继承。

line-length = 100
target-version = "py313"

[lint]
# 选一套务实的规则集：抓未定义/未用、导入顺序、明显坏味道，不过度严苛。
select = [
  "E",    # pycodestyle 错误（缩进/空格/空行）
  "F",    # Pyflakes（未定义/未用/重名）
  "W",    # pycodestyle 警告
  "I",    # isort 导入排序
  "B",    # bugbear 常见 bug 模式
  "UP",   # pyupgrade 现代化写法
  "SIM",  # simplify 简化建议
]
ignore = [
  "E501",  # 行宽由 formatter 负责，lint 不再单独报
  "B008",  # FastAPI 里 router 装饰器常带函数调用，关掉
  "SIM105", # 有时 try/except 包裹更清晰
]

[lint.per-file-ignores]
# 测试文件允许未用导入/变量
"tests/**" = ["F401", "F811"]

[format]
quote-style = "double"
indent-style = "space"
